name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'   # the floor the validator promises

      # Discovery, not a hardcoded list: the previous four-file list and the
      # identical copy in zrb_init.py both went stale the moment a script moved.
      - name: Compile bundled scripts
        run: python3 -m compileall -q skills evals tests zrb_init.py

      - name: Validator regression tests
        run: python3 tests/test_sdlc_validate.py

      - name: Prompt invariants
        run: python3 tests/test_skill_prompts.py

      - name: Lint eval cases
        run: python3 evals/run.py

      - name: Installer dry-run
        run: bin/install.sh --dry-run --tools claude

      # "all" must mean every VERIFIED tool. It used to mean every tool the
      # script knew a path for, creating ~/.bob, ~/.qoder and ~/.trae for
      # software nobody had installed.
      - name: Installer "all" targets only verified tools
        run: |
          set -euo pipefail
          out="$(bin/install.sh --dry-run --tools all)"
          echo "$out" | grep -q '\.claude/skills'
          echo "$out" | grep -q '\.zrb/skills'
          ! echo "$out" | grep -qE '\.(cospec|bob|qoder|trae|github)/skills'

      - name: Installer project-scoped target
        run: bin/install.sh --dry-run --dir .claude/skills

      - name: Installer upgrades over a previous version
        run: |
          set -euo pipefail
          export HOME="$(mktemp -d)"
          mkdir -p "$HOME/.claude/skills/sdlc-requirements" \
                   "$HOME/.claude/skills/unrelated-skill" \
                   "$HOME/.claude/skills/sdlc-deploy"
          bin/install.sh --tools claude > /dev/null
          test ! -d "$HOME/.claude/skills/sdlc-requirements" \
            || { echo "merged-away skill was left behind"; exit 1; }
          test -d "$HOME/.claude/skills/sdlc-plan"
          test -f "$HOME/.claude/skills/sdlc-init/assets/tools/sdlc-validate.py"
          test -d "$HOME/.claude/skills/unrelated-skill" \
            || { echo "a non-sdlc skill was removed"; exit 1; }
          test -d "$HOME/.claude/skills/sdlc-deploy" \
            || { echo "a user's own sdlc-* skill was removed"; exit 1; }
          bin/install.sh --uninstall --tools claude > /dev/null
          test -z "$(find "$HOME/.claude/skills" -maxdepth 1 -name 'sdlc-plan')"
          test -d "$HOME/.claude/skills/unrelated-skill"
          test -d "$HOME/.claude/skills/sdlc-deploy" \
            || { echo "uninstall removed a skill that is not ours"; exit 1; }
